# Connexion PostgreSQL (variables d'environnement, avec valeurs par défaut pour le local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/task_manager_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=${JWT_SECRET:CeciEstUneCleSecretePourJWTQuiDoitFaireAuMoins32Caracteres}

# Port (Render fournit le port dynamiquement en production)
server.port=${PORT:8080}