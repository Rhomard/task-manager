<mat-toolbar class="toolbar">
  <div class="toolbar-left">
    <span class="toolbar-title">Task Manager</span>
    @if (authService.isAuthenticated()) {
      <span class="toolbar-user toolbar-user--mobile">{{ authService.userEmail() }}</span>
    }
  </div>

  <span class="toolbar-spacer"></span>

  @if (authService.isAuthenticated()) {
    <span class="toolbar-user toolbar-user--desktop">{{ authService.userEmail() }}</span>
    <span class="toolbar-spacer"></span>
  }

  @if (authService.isAuthenticated()) {
    <button mat-icon-button (click)="authService.logout()" aria-label="Déconnexion">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<div class="page-content">
  <router-outlet />
</div>
