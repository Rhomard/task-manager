<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre de la tâche</mat-label>
        <input matInput formControlName="titre" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <div class="form-row">
        <mat-form-field appearance="outline" class="form-row-field">
          <mat-label>Catégorie</mat-label>
          <mat-select formControlName="category">
            @for (cat of categories; track cat) {
              <mat-option [value]="cat">{{ cat }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-row-field">
          <mat-label>Date d'échéance</mat-label>
          <input matInput type="date" formControlName="dateEcheance" />
        </mat-form-field>
      </div>

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="form.invalid">
          {{ taskToEdit ? 'Modifier' : 'Ajouter' }}
        </button>
        @if (taskToEdit) {
          <button mat-stroked-button type="button" (click)="onCancel()">Annuler</button>
        }
      </div>
    </form>
  </mat-card-content>
</mat-card>
